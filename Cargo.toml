[workspace]
resolver = "3"
members = ["crates/warp-core", "crates/warp-cli", "app/src-tauri"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
warp-core = { path = "crates/warp-core" }
anyhow = "1"
base64 = "0.23"
calamine = "0.36"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
flate2 = "1.1"
proptest = "1.11"
rayon = "1"
regex = "1"
rpfm_lib = "4.7.4"
steamlocate = "2.1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
ureq = { version = "3.4", features = ["json"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# rpfm_lib parses packs; unoptimised it makes a debug-build library sync crawl.
[profile.dev.package."*"]
opt-level = 2
